[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "hexapod-mobile-manipulator"
version = "0.1.0"
description = "Bio-inspired gait coordination and six-axis mobile manipulation research platform"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]
[project.optional-dependencies]
hardware = ["pyserial>=3.5,<4"]
vision = ["opencv-python>=4.8,<5", "onnxruntime>=1.17,<2"]
[project.scripts]
hexapod = "hexapod.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
